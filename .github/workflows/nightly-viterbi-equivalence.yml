name: Nightly Viterbi streaming equivalence

# Runs the 5 real-session streaming-vs-reference equivalence tests
# (viterbiStreamingEquivalence.test.ts) that `npm test` deliberately skips —
# the O(T×S²) reference decode alone takes minutes per fixture (~155s for the
# largest, 955 windows), too slow to pay on every push. CADENCE_NIGHTLY=1 is
# what un-skips them (see `it.skipIf(!process.env.CADENCE_NIGHTLY)` in that
# file) — this is the ONLY place that variable should be set.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

jobs:
  streaming-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CADENCE_NIGHTLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # ffmpeg-static ships a postinstall that downloads an ~80 MB binary from
      # GitHub releases. Unauthenticated release traffic from a shared runner IP
      # gets rate-limited, and the script retries on a 30s timeout — which is the
      # step that never finishes. Pointing FFMPEG_BIN at the runner's own ffmpeg
      # makes its install script exit early ("installed already") without
      # downloading anything. It is an optionalDependency used ONLY by
      # experiments/noise-study, never by the build or the tests.
      #
      # Deliberately NOT --omit=optional: rollup and esbuild ship their
      # platform binaries as optional deps, and omitting those breaks the build.
      env:
        FFMPEG_BIN: /usr/bin/ffmpeg
      - run: npm run test:nightly
