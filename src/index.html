<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Filled in by CspPlugin in webpack.config.js, which hashes the theme
         bootstrap below from the FINAL document (minification changes it). The
         meta has to sit above that script: a meta CSP only governs what the
         parser reaches after it. Editing the script needs no action here — the
         hash is recomputed at every build, and a missing placeholder fails it. -->
    <meta http-equiv="Content-Security-Policy" content="%CSP%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="google-site-verification" content="BMOLrfAEPhArhO1j7n2nRj6xODBjIqJcxqR5N_dtUMk" />
    <title>Cadence — Spaced repetition for anything you want to remember</title>
    <meta name="description" content="Cadence is a spaced repetition app for learning and retaining anything — words, concepts, tunes, and more — with extra tools for Irish traditional musicians." />
    <link rel="canonical" href="https://batpapa.github.io/Cadence/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cadence" />
    <meta property="og:url" content="https://batpapa.github.io/Cadence/" />
    <meta property="og:title" content="Cadence — Spaced repetition for anything you want to remember" />
    <meta property="og:description" content="Learn and retain anything — words, concepts, tunes, and more — with spaced repetition. Includes extra tools for Irish traditional musicians." />
    <meta property="og:image" content="https://batpapa.github.io/Cadence/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Cadence — Spaced repetition for anything you want to remember" />
    <meta name="twitter:description" content="Learn and retain anything — words, concepts, tunes, and more — with spaced repetition. Includes extra tools for Irish traditional musicians." />
    <meta name="twitter:image" content="https://batpapa.github.io/Cadence/icons/icon-512.png" />
    <!-- Plain ES5 on purpose: this runs before anything else, on browsers too
         old for the bundle, whose job is precisely to say so. -->
    <script>
      (function(){
        var d=document.documentElement, nav=navigator, ua=nav.userAgent;
        function meta(name){ return document.querySelector('meta[name="'+name+'"]'); }
        // Same default as themeService.getTheme(): light on a phone, dark elsewhere.
        var t=null; try { t=localStorage.getItem('cadence_theme'); } catch(e) {}
        t=t||(innerWidth<768&&nav.maxTouchPoints>0?'light':'dark');
        d.dataset.theme=t;
        d.style.background=t==='light'?'#ffffff':t==='green'?'#f7faf5':'#0a0a0a';
        // The header's colour, so the browser's own bar matches it; kept in step by
        // themeService.applyTheme().
        meta('theme-color').content=t==='light'?'#f5f5f5':t==='green'?'#edf4e8':'#141414';
        // iPhone, iPad (whose Safari claims to be a Mac) and iPod. iOS zooms into any
        // text field rendered under 16 px and never zooms back out; maximum-scale
        // stops that, while iOS keeps pinch-zoom regardless since iOS 10. Not on
        // Android, where it would really forbid pinch-zoom.
        if (/iPad|iPhone|iPod/.test(ua)||(nav.maxTouchPoints>1&&/Macintosh/.test(ua))) {
          d.classList.add('ios');
          // Launched from the home screen. Its status bar stays black-translucent
          // whatever the theme: 'default' for the light themes (2026-10-11) left the
          // app a status bar's height short of the bottom of the screen. Its white
          // text gets a dark band to sit on instead (styles.css, html.standalone).
          if (nav.standalone===true) d.classList.add('standalone');
          meta('viewport').content+=', maximum-scale=1';
          // Safari on iOS only applies :active to an element with a touch listener
          // somewhere above it.
          document.addEventListener('touchstart',function(){},{passive:true});
        }
        // What the app cannot start without (Safari 15.4, 2022). Below that, a plain
        // message instead of an app that breaks at the first edit; main.ts stops at
        // the flag, and the message goes in once the page is parsed.
        if (!(window.crypto&&crypto.randomUUID&&window.structuredClone&&[].at)) {
          d.dataset.unsupported='1';
          document.addEventListener('DOMContentLoaded',function(){
            var fr=/^fr/i.test(nav.language||'');
            var app=document.getElementById('app'), p=document.createElement('p');
            p.style.cssText='margin:auto;max-width:28rem;padding:24px;text-align:center;font:16px/1.5 sans-serif';
            p.textContent=fr
              ? "Ce navigateur est trop ancien pour Cadence (iOS ou Safari 15.4 au minimum). Mettre à jour l'appareil, ou utiliser un navigateur plus récent."
              : 'This browser is too old for Cadence (iOS or Safari 15.4 at least). Update the device, or use a more recent browser.';
            if (app) app.appendChild(p);
          });
        }
      })();
    </script>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="icon" type="image/png" href="icons/icon-32.png" />
  </head>
  <body class="bg-bg text-primary font-sans antialiased">
    <div id="app" class="flex flex-col overflow-hidden"></div>
    <!-- Written in English here and retranslated by i18nService.setLanguage()
         through `data-i18n`: this markup exists precisely so the links are
         readable with no JavaScript at all (see styles.css), so the English
         text must stay in the HTML as the crawlable fallback. -->
    <footer id="legal-footer">
      <a href="./privacy.html" rel="noopener" data-i18n="settings.privacyPolicy">Privacy Policy</a>
      &nbsp;·&nbsp;
      <a href="./terms.html" rel="noopener" data-i18n="settings.termsOfService">Terms of Service</a>
    </footer>
  </body>
</html>
