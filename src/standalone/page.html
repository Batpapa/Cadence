<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Filled in by CspPlugin (webpack.config.js), which hashes the inline
         script below from the final document, as for the app's index.html. -->
    <meta http-equiv="Content-Security-Policy" content="%CSP%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141414" />
    <title><%= htmlWebpackPlugin.options.title %></title>
    <meta name="description" content="<%= htmlWebpackPlugin.options.description %>" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cadence" />
    <meta property="og:title" content="<%= htmlWebpackPlugin.options.title %>" />
    <meta property="og:description" content="<%= htmlWebpackPlugin.options.description %>" />
    <meta property="og:image" content="https://batpapa.github.io/Cadence/icons/icon-512.png" />
    <!-- The app's theme, before the first paint — the app's own bootstrap
         (index.html), reduced to the theme: a standalone page shares the
         setting with the app, as it shares its origin. -->
    <script>
      (function(){
        var d=document.documentElement, t=null;
        try { t=localStorage.getItem('cadence_theme'); } catch(e) {}
        if (!t) {
          t=window.matchMedia&&matchMedia('(pointer: coarse)').matches?'light':'dark';
          try { localStorage.setItem('cadence_theme', t); } catch(e) {}
        }
        d.dataset.theme=t;
        d.style.background=t==='light'?'#ffffff':t==='green'?'#f7faf5':'#0a0a0a';
        document.querySelector('meta[name="theme-color"]').content=t==='light'?'#f5f5f5':t==='green'?'#edf4e8':'#141414';
      })();
    </script>
    <!-- The app's manifest, so that the browser offers to install from here
         too (the header's install button): its start_url is the app. -->
    <link rel="manifest" href="../manifest.json" />
    <link rel="icon" type="image/png" href="../icons/icon-32.png" />
    <link rel="apple-touch-icon" href="../icons/icon-180.png" />
  </head>
  <body class="bg-bg text-primary font-sans antialiased">
    <div id="app"></div>
  </body>
</html>
