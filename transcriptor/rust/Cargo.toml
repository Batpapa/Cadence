[package]
name = "cadence_transcriptor"
version = "0.1.0"
edition = "2021"
description = "Spectral analysis of cadence-transcriptor (src/spectrum.ts), in Rust for WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustfft = { version = "6.4", features = ["wasm_simd"] }
wasm-bindgen = "=0.2.92"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
